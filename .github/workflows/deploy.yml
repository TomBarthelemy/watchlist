name: Deploy Angular App

on:
  push:
    branches: [ master ]

permissions:
  contents: write   
  pages: write    

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -- --configuration production --base-href "https://tombarthelemy.github.io/watchlist/"
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/watchlist
