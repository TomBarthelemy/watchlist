name: Deploy Angular App

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_BASE: /watchlist/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build Angular app
        run: |
          rm -rf dist
          npm run build -- --configuration production \
            --base-href "${{ env.APP_BASE }}" \
            --deploy-url "${{ env.APP_BASE }}"

      - name: SPA fallback (404.html)
        run: cp dist/watchlist/browser/index.html dist/watchlist/browser/404.html

      - name: Debug - list built assets and bad URLs (before patch)
        run: |
          echo "== List of built icons =="
          ls -la dist/watchlist/browser/assets/icons || true
          echo "== Base href in index.html =="
          grep -o 'base href="[^"]*"' dist/watchlist/browser/index.html || true
          echo "== Bad absolute URLs =="
          grep -Rno '/assets/icons/' dist/watchlist/browser || true
          echo "== Bad relative URLs =="
          grep -Rno 'url(assets/icons/' dist/watchlist/browser || true
          grep -Rno 'src="assets/icons/' dist/watchlist/browser || true

      - name: Patch - rewrite ALL asset URLs for GitHub Pages
        run: |
          # 1) /assets/...  -> /watchlist/assets/...
          find dist/watchlist/browser -type f \( -name "*.css" -o -name "*.js" -o -name "*.html" \) -print0 \
            | xargs -0 sed -i 's#/assets/#/watchlist/assets/#g'
          # 2) url(assets/...) -> url(/watchlist/assets/...)
          find dist/watchlist/browser -type f \( -name "*.css" -o -name "*.js" \) -print0 \
            | xargs -0 sed -i 's#url(assets/#url(/watchlist/assets/#g'
          # 3) src="assets/..." -> src="/watchlist/assets/..."
          find dist/watchlist/browser -type f -name "*.html" -print0 \
            | xargs -0 sed -i 's#src="assets/#src="/watchlist/assets/#g'

      - name: Debug - confirm URLs after patch
        run: |
          echo "== Remaining /assets/ references (should be empty) =="
          grep -Rno '/assets/icons/' dist/watchlist/browser || true
          echo "== Final /watchlist/assets/ references (should exist) =="
          grep -Rno '/watchlist/assets/icons/' dist/watchlist/browser | head -n 20 || true
      
      



      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/watchlist/browser
