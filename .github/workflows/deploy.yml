name: Deploy Angular App

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_BASE: /watchlist/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build Angular app
        run: |
          rm -rf dist
          npm run build -- --configuration production \
            --base-href "${{ env.APP_BASE }}" \
            --deploy-url "${{ env.APP_BASE }}"

      - name: SPA fallback (404.html)
        run: cp dist/watchlist/browser/index.html dist/watchlist/browser/404.html

      - name: Rewrite asset URLs for GitHub Pages (/ → /watchlist/)
        run: |
          find dist/watchlist/browser -type f \( -name "*.css" -o -name "*.js" -o -name "*.html" \) -print0 \
            | xargs -0 sed -i 's/\/assets\//\/watchlist\/assets\//g'
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/watchlist/browser
