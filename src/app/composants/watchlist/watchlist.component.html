<div class="watchlist">

  <app-search-form></app-search-form>

  <div class="section-sep" role="separator" aria-hidden="true"></div>

  <app-list-item
    class="list-item"
    [seenCount]="seenCount()"
    [totalCount]="total()"
  ></app-list-item>
</div>

<!-- Le petit lit de popcorn -->
<div class="popcorn-floor"></div>
<div
  class="popcorn-overlay"
  popcornEmitter
  [rate]="20"
  [max]="36"
  [minSize]="22"
  [maxSize]="36"
  [minHeightVh]="80"
  [maxHeightVh]="100"
  [spreadX]="90"
  [minSpin]="160"
  [maxSpin]="360"
  [minDuration]="1800"
  [maxDuration]="2400"
  [bounceMin]="14"
  [bounceMax]="26"
  [settleHold]="240"
></div>
