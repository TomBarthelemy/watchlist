<div class="wl">
  <button
    type="button"
    class="add-toggle btn btn--primary"
    (click)="formOpen.set(!formOpen())"
    [attr.aria-expanded]="formOpen()"
    aria-controls="add-collapsible"
  >
    <span class="chevron" [class.open]="formOpen()"></span>Ajouter une
    proposition
  </button>

  <!-- Collapsible container (always open on desktop via CSS) -->
  <div
    id="add-collapsible"
    class="add-collapsible"
    [class.is-open]="formOpen()"
  >
    <form class="form" [formGroup]="form" (ngSubmit)="addItem()">
      <input placeholder="Titre…" formControlName="title" maxlength="100" />
      <select formControlName="category" aria-label="Catégorie">
        <option>Film</option>
        <option>Série</option>
        <option>Animé</option>
      </select>
      <button
        type="submit"
        class="btn btn--secondary btn--add"
        [disabled]="form.invalid"
      >Ajouter
        <span
          class="ic"
          [ngClass]="justAdded() ? 'ic-check' : 'ic-plus'"
          aria-hidden="true"
        ></span>
      </button>
    </form>
  </div>

  <div class="section-sep" role="separator" aria-hidden="true"></div>

  <div class="toolbar">
    <select class="filter" [formControl]="filterCtrl" aria-label="Filtrer par">
      <option value="Tout">Tout</option>
      <option value="Film">Film</option>
      <option value="Série">Série</option>
      <option value="Animé">Animé</option>
      <option value="A_voir">À voir</option>
      <option value="Vus">Vus</option>
      <option value="Mes_ajouts">Mes propositions</option>
      <option value="Ajouts_autres">Ses propositions</option>
    </select>

    <select class="sort" [formControl]="sortCtrl" aria-label="Trier par">
      <option value="created_desc">Ajouts récents</option>
      <option value="created_asc">Plus anciens</option>
      <option value="title_asc">Titre A → Z</option>
      <option value="title_desc">Titre Z → A</option>
    </select>
  </div>

  <div *ngIf="supa.loading()" class="loading">Chargement…</div>

  <!-- Only this box scrolls -->
  <div class="list-scroll">
    <ul class="list">
      <li
        *ngFor="let item of sorted()"
        [class.seen]="item.seen"
        [class.li--self]="isSelf(item)"
        [class.li--other]="!isSelf(item)"
      >
        <div class="left">
          <strong class="title" [title]="item.title">
            {{
              item.title.length > 50
                ? (item.title | slice : 0 : 50) + "…"
                : item.title
            }}
          </strong>
          <span
            class="badge"
            [ngClass]="{
              'badge--film': item.category === 'Film',
              'badge--serie': item.category === 'Série',
              'badge--anime': item.category === 'Animé'
            }"
          >
            {{ item.category }}
          </span>
          <a
            *ngIf="item.trailer_url"
            [attr.href]="item.trailer_url"
            target="_blank"
            rel="noopener noreferrer"
            class="btn--youtube-icon"
            title="Voir le trailer sur YouTube"
            aria-label="Voir le trailer sur YouTube"
          ></a>
        </div>
        <div class="right">
          <span *ngIf="item.seen_at"
            >Vu le {{ formatDate(item.seen_at) }}
          </span>

          <mat-slide-toggle
            class="toggle"
            [checked]="item.seen"
            (change)="toggle(item)"
            color="secondary"
          >
            <span> Vu ?</span>
          </mat-slide-toggle>

          <div class="delete">
            <button
              class="btn btn--danger-icon"
              (click)="remove(item.id)"
              title="Supprimer l'item"
              aria-label="Supprimer l'item"
            >
              <span class="icon-trash" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </li>
    </ul>
  </div>

  <!-- Always visible; not inside the scroller -->
  <footer class="stats">{{ seenCount() }} / {{ total() }} vus</footer>
</div>

<!-- tout en bas du template -->
<div class="popcorn-floor"></div>
<div
  class="popcorn-overlay"
  popcornEmitter
  [rate]="20"
  [max]="36"
  [minSize]="22"
  [maxSize]="36"
  [minHeightVh]="80"
  [maxHeightVh]="100"
  [spreadX]="90"
  [minSpin]="160"
  [maxSpin]="360"
  [minDuration]="1800"
  [maxDuration]="2400"
  [bounceMin]="14"
  [bounceMax]="26"
  [settleHold]="240"
></div>
