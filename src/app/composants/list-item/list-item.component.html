<div class="list-item">
  <div class="toolbar">
    <select class="filter" [formControl]="filterCtrl" aria-label="Filtrer par">
      <option value="Tout">Tout</option>
      <option value="Film">Film</option>
      <option value="Série">Série</option>
      <option value="Animé">Animé</option>
      <option value="Dessin animé">Dessin animé</option>
      <option value="A_voir">À voir</option>
      <option value="Vus">Vus</option>
      <option value="Mes_ajouts">Mes propositions</option>
      <option value="Ajouts_autres">Ses propositions</option>
    </select>

    <select class="sort" [formControl]="sortCtrl" aria-label="Trier par">
      <option value="created_desc">Ajouts récents</option>
      <option value="created_asc">Plus anciens</option>
      <option value="title_asc">Titre A → Z</option>
      <option value="title_desc">Titre Z → A</option>
    </select>
  </div>

  <div *ngIf="!itemsLoaded()" class="loading">Chargement…</div>

  <div class="list-scroll">
    <ul class="list">
      <li
        *ngFor="let item of sorted()"
        class="item-card"
        [class.item-card--seen]="item.seen"
        [class.item-card--self]="isSelf(item)"
        [class.item-card--other]="!isSelf(item)"
      >
        <!-- HEADER (cliquable pour déplier) -->
        <div class="item-card-header" (click)="toggleExpanded(item.id)">

          <!-- Gauche : poster + infos -->
          <div class="item-card-left">
            <div class="item-card-poster">
              <img
                [src]="getPosterUrl(item.poster_path)"
                [alt]="item.title"
                loading="lazy"
              />
            </div>

            <div class="item-card-main">
              <!-- Ligne 1 : titre (2 lignes max) -->
              <strong class="item-card-title" [title]="item.title">
                {{ item.title }}
              </strong>

              <!-- Ligne 2 : année + catégorie -->
              <div class="item-card-meta">
                <span class="item-card-year" *ngIf="item.year">
                  {{ item.year }}
                </span>

                <span
                  class="badge"
                  [ngClass]="{
                    'badge--film': item.category === 'Film',
                    'badge--serie': item.category === 'Série',
                    'badge--anime': item.category === 'Animé',
                    'badge--dessin-anime': item.category === 'Dessin animé'
                  }"
                >
                  {{ item.category }}
                </span>

                <a
                  *ngIf="item.trailer_url"
                  [attr.href]="item.trailer_url"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn-youtube-icon"
                  title="Voir le trailer sur YouTube"
                  aria-label="Voir le trailer sur YouTube"
                  (click)="$event.stopPropagation()"
                ></a>

                <span class="item-card-seen-at" *ngIf="item.seen_at">
                  • Vu le {{ formatDate(item.seen_at) }}
                </span>
              </div>

              <!-- Ligne 3 : tous les genres -->
              <div class="item-card-genres" *ngIf="item.genre">
                <span
                  class="genre-pill"
                  *ngFor="let genre of splitGenres(item.genre)"
                >
                  {{ genre }}
                </span>
              </div>
            </div>
          </div>

          <!-- Droite : actions -->
          <div class="item-card-right">
            <button
              class="btn-expand"
              type="button"
              (click)="toggleExpanded(item.id); $event.stopPropagation()"
              [attr.aria-expanded]="expandedId === item.id"
              aria-label="Afficher plus de détails"
            >
              <span class="icon-chevron" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <!-- DÉTAILS (overview + trailer) -->
        <div class="item-card-details" *ngIf="expandedId === item.id">
          <div class="item-card-details-inner">
            <div
              class="item-card-overview"
              *ngIf="item.overview; else noOverview"
            >
              {{ item.overview }}
            </div>

            <ng-template #noOverview>
              <div class="item-card-overview item-card-overview--empty">
                Aucun synopsis disponible.
              </div>
            </ng-template>

            <div class="item-card-actions">
              <mat-slide-toggle
                class="item-card-toggle"
                [checked]="item.seen"
                (click)="$event.stopPropagation()"
                (change)="toggle(item)"
                color="secondary"
              >
                <span>Vu ?</span>
              </mat-slide-toggle>

              <button
                class="btn-danger-icon"
                (click)="remove(item.id); $event.stopPropagation()"
                title="Supprimer l'item"
                aria-label="Supprimer l'item"
              >
                <span class="icon-trash" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
