<section class="watchlist-members">
  <header class="watchlist-members__header">
    <h2 class="watchlist-members__title">Membres de la watchlist</h2>
    <p class="watchlist-members__subtitle">
      Consultez les membres et leurs rôles d'accès
    </p>
  </header>

  <!-- Loading state -->
  <ng-container *ngIf="loading()">
    <div class="watchlist-members__loading">
      <p>Chargement des membres...</p>
    </div>
  </ng-container>

  <!-- Error state -->
  <ng-container *ngIf="error() && !loading()">
    <div class="watchlist-members__error card">
      <p>{{ error() }}</p>
      <button
        class="btn btn--secondary"
        type="button"
        (click)="retryLoadMembers()"
      >
        Réessayer
      </button>
    </div>
  </ng-container>

  <!-- Members list -->
  <ng-container *ngIf="!loading() && members().length > 0">
    <div class="watchlist-members__list">
      <div class="watchlist-members__item" *ngFor="let member of members()">
        <div class="watchlist-members__member-info">
          <p class="watchlist-members__member-name">{{ member.user_name }}</p>
          <p class="watchlist-members__member-email">{{ member.user_email }}</p>
        </div>

        <div class="watchlist-members__member-role">
          <span class="watchlist-members__role" [class]="'role--' + member.role">
            {{ getRoleLabel(member.role) }}
          </span>
        </div>

        <!-- Actions (future: implement based on permissions) -->
        <div class="watchlist-members__actions" *ngIf="canRemoveMember(member.role)">
          <button
            class="btn btn--icon watchlist-members__btn-remove"
            type="button"
            title="Supprimer le membre"
            aria-label="Supprimer le membre"
          >
            <span class="icon icon-delete" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Empty state (no members - shouldn't happen normally) -->
  <ng-container *ngIf="!loading() && !error() && members().length === 0">
    <div class="watchlist-members__empty card">
      <p>Aucun membre trouvé.</p>
    </div>
  </ng-container>
</section>
