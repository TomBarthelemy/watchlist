<section class="reset-password-form card">
  <header>
    <h2>Réinitialiser le mot de passe</h2>
    <p>Page cible dédiée pour le lien envoyé par email.</p>
  </header>

  <label>
    <span>Nouveau mot de passe</span>
    <input type="password" [value]="password()" (input)="password.set(($any($event.target).value ?? '').toString())" />
  </label>

  <label>
    <span>Confirmer</span>
    <input type="password" [value]="confirmPassword()" (input)="confirmPassword.set(($any($event.target).value ?? '').toString())" />
  </label>

  <button class="btn btn--primary" type="button" (click)="submit()">Mettre à jour</button>

  <p class="reset-password-form__feedback" *ngIf="feedback()">{{ feedback() }}</p>
</section>
