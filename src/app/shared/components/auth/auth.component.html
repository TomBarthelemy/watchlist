<div class="auth-box card">
  <h2 class="auth-title">Connexion</h2>
  <p class="auth-sub">Entre ton email et ton mot de passe.</p>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="onLogin()">
    <label class="field">
      <span class="field-label">Email</span>
      <input
        type="email"
        formControlName="email"
        name="email"
        placeholder="you@example.com"
        inputmode="email"
        autocomplete="username"
        autocapitalize="off"
        spellcheck="false"
        autofocus
        [class.invalid]="form.controls.email.invalid && (form.controls.email.dirty || form.controls.email.touched)"/>
    </label>

    <label class="field">
      <span class="field-label">Mot de passe</span>
      <div class="pw">
        <input
          [type]="showPw() ? 'text' : 'password'"
          formControlName="password"
          name="current-password"
          placeholder="••••••••"
          [class.invalid]="form.controls.password.invalid && (form.controls.password.dirty || form.controls.password.touched)"/>
        <button type="button" class="pw-toggle" (click)="togglePw()" aria-label="Afficher/masquer le mot de passe">
          {{ showPw() ? '🙈' : '👁️' }}
        </button>
      </div>
    </label>

    <button type="submit" class="btn btn--primary btn--lg" [disabled]="form.invalid || busy()">
      {{ busy() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</div>
