<main class="container">
  <header class="header">
    <div class="brand">
      <h1 class="brand-title">Watchlist</h1>
      <img
        class="brand-icon"
        src="assets/icons/popcorn-icon.svg"
        alt="Popcorn icon"
      />
    </div>

    <div class="right">
      <div class="presence" *ngIf="supa.onlineUsers().length">
        <span
          *ngFor="let u of supa.onlineUsers()"
          class="chip"
          [class.chip--self]="u.isSelf"
          [class.chip--other]="!u.isSelf"
          [title]="u.name"
        >
          {{ u.name }}
        </span>
      </div>

      <button
        title="This is a hint"
        class="btn btn--theme"
        title="Changer le thème"
        aria-label="Changer le thème"
        (click)="theme.toggle()"
      >
        <span
          class="icon"
          [class.is-sun]="theme.theme() === 'light'"
          [class.is-moon]="theme.theme() === 'dark'"
        ></span>
      </button>

      <div class="user">
        <button
          class="btn btn--logout"
          *ngIf="supa.user()"
          type="button"
          (click)="signOut()"
          title="Se déconnecter"
          aria-label="Se déconnecter"
        >
          <span class="icon icon-logout" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <section class="content">
    <ng-container *ngIf="supa.user(); else auth">
      <app-watchlist />
    </ng-container>
    <ng-template #auth>
      <app-auth />
    </ng-template>
  </section>
</main>
