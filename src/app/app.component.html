<main class="container">
  <!-- Application header: branding, theme, user actions -->
  <header class="header">
    <button class="brand" type="button" (click)="goHome()" title="Mes watchlists" aria-label="Mes watchlists">
      <h1 class="brand-title">Watchlist</h1>
      <img class="brand-icon" src="assets/icons/popcorn-icon.svg" alt="Popcorn icon" />
    </button>

    <nav class="header__nav" *ngIf="isAuthenticated() && !isOnLoginPage()" aria-label="Navigation principale">
      <a class="header__nav-link" routerLink="/watchlists" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Watchlists</a>
      <a class="header__nav-link" routerLink="/friends" routerLinkActive="is-active">Amis</a>
      <a class="header__nav-link" routerLink="/invitations" routerLinkActive="is-active">Invitations</a>
    </nav>

    <div class="header__actions" [class.header__actions--with-mobile-menu]="shouldShowHamburger()">
      <!-- Online user presence indicator -->
      <div class="presence" *ngIf="shouldShowPresence()">
        <app-online-presence [users]="presenceUsers()"></app-online-presence>
      </div>

      <!-- Theme toggle -->
      <div class="theme">
        <button
          class="btn btn--theme"
          type="button"
          title="Changer le thème"
          aria-label="Changer le thème"
          (click)="theme.toggle()"
        >
          <span
            class="icon"
            [class.is-sun]="theme.theme() === 'light'"
            [class.is-moon]="theme.theme() === 'dark'"
          ></span>
        </button>
      </div>

      <!-- <div class="profile" *ngIf="supa.user()">
        <button
          class="btn btn--profile"
          type="button"
          title="Mon profil"
          aria-label="Mon profil"
          (click)="goToProfile()"
        >
          <img *ngIf="profile.profile()?.avatarUrl as avatarUrl; else profileFallback" class="profile-avatar-image" [src]="avatarUrl" alt="" />
          <ng-template #profileFallback>
            <span class="profile-avatar-fallback" aria-hidden="true">{{ profile.initials() }}</span>
          </ng-template>
        </button>
      </div> -->

      <button
        *ngIf="shouldShowHamburger()"
        class="header__menu-button"
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="Ouvrir le menu"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="app-mobile-menu"
      >
        <span class="header__menu-bar"></span>
        <span class="header__menu-bar"></span>
        <span class="header__menu-bar"></span>
      </button>
    </div>
  </header>

  <ng-container *ngIf="shouldShowHamburger()">
    <div
      class="mobile-menu__overlay"
      [class.is-open]="mobileMenuOpen()"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>

    <aside
      id="app-mobile-menu"
      class="mobile-menu"
      [class.is-open]="mobileMenuOpen()"
      [attr.aria-hidden]="!mobileMenuOpen()"
      aria-label="Menu latéral"
    >
      <div class="mobile-menu__header">
        <span class="mobile-menu__title">Menu</span>
        <button class="mobile-menu__close" type="button" (click)="closeMobileMenu()" aria-label="Fermer le menu">
          &#x2715;
        </button>
      </div>

      <div class="mobile-menu__section mobile-menu__section--global" aria-label="Navigation principale">
        <button class="mobile-menu__link" type="button" (click)="goHome()">
          <span class="mobile-menu__icon mobile-menu__icon--watchlists" aria-hidden="true"></span>
          <span class="mobile-menu__text">Mes watchlists</span>
        </button>
        <button class="mobile-menu__link" type="button" (click)="goToFriends()">
          <span class="mobile-menu__icon mobile-menu__icon--users" aria-hidden="true"></span>
          <span class="mobile-menu__text">Amis</span>
        </button>
        <button class="mobile-menu__link" type="button" (click)="goToInvitations()">
          <span class="mobile-menu__icon mobile-menu__icon--invite" aria-hidden="true"></span>
          <span class="mobile-menu__text">Invitations</span>
        </button>
      </div>

      <nav class="mobile-menu__section mobile-menu__section--watchlist" *ngIf="hasActiveWatchlist() && currentListId() as listId" aria-label="Watchlist active">
        <p class="mobile-menu__section-title">Watchlist active ({{ activeWatchlistProgressLabel() }})</p>
        <a class="mobile-menu__link" [routerLink]="['/watchlist', listId, 'members']" [queryParams]="{ from: 'watchlist' }" (click)="closeMobileMenu()">
          <span class="mobile-menu__icon mobile-menu__icon--users" aria-hidden="true"></span>
          <span class="mobile-menu__text">Membres</span>
        </a>
        <a class="mobile-menu__link" [routerLink]="['/watchlist', listId, 'settings']" [queryParams]="{ from: 'watchlist' }" (click)="closeMobileMenu()">
          <span class="mobile-menu__icon mobile-menu__icon--settings" aria-hidden="true"></span>
          <span class="mobile-menu__text">Param&egrave;tres</span>
        </a>
      </nav>

      <div class="mobile-menu__section mobile-menu__section--account" *ngIf="supa.user()" aria-label="Compte utilisateur">
        <button class="mobile-menu__utility" type="button" (click)="goToProfile()" aria-label="Mon profil">
          <span class="mobile-menu__profile-avatar" aria-hidden="true">
            <img
              *ngIf="profile.profile()?.avatarUrl as avatarUrl"
              class="mobile-menu__profile-avatar-img"
              [src]="avatarUrl"
              alt=""
            />
            <ng-container *ngIf="!profile.profile()?.avatarUrl">
              <span class="mobile-menu__icon mobile-menu__icon--profile"></span>
            </ng-container>
          </span>
          <span class="mobile-menu__text">Mon profil</span>
        </button>
      </div>

      <div class="mobile-menu__actions">
        <button
          class="mobile-menu__utility"
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="themeToggleLabel()"
          [title]="themeToggleLabel()"
        >
          <span
            class="mobile-menu__icon"
            [class.is-sun]="nextTheme() === 'light'"
            [class.is-moon]="nextTheme() === 'dark'"
            aria-hidden="true"
          ></span>
          <span class="mobile-menu__text">{{ themeToggleLabel() }}</span>
        </button>

        <button class="mobile-menu__utility mobile-menu__utility--logout" type="button" (click)="signOut()" aria-label="Se deconnecter">
          <span class="mobile-menu__icon mobile-menu__icon--logout" aria-hidden="true"></span>
          <span class="mobile-menu__text">D&eacute;connexion</span>
        </button>
      </div>
    </aside>
  </ng-container>

  <!-- Tiny screen warning (≤329px): shown on all pages via CSS media query -->
  <div class="tiny-screen-hint" role="status" aria-live="polite">
    Mini écran détecté&nbsp;: mode ultra compact activé. Pour plus de confort, agrandis la fenêtre.
  </div>

  <!-- Main content area: routed pages -->
  <section class="content">
    <router-outlet />
  </section>
</main>
